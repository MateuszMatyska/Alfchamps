server {
    listen 8080;
    server_name _;

    # Static frontend build.
    root /usr/share/nginx/html;
    index index.html;

    # Proxy to a FIXED backend IP (see `ipv4_address` in container-compose.yaml).
    #
    # Why not `proxy_pass http://backend:8000;`? Two podman pitfalls:
    #   1. nginx resolves the service name once at startup and caches the IP; a
    #      recreated backend gets a new IP and nginx keeps dialing the dead one
    #      (long hangs, then 502 Bad Gateway).
    #   2. podman's aardvark DNS accumulates STALE A records for removed
    #      containers, so even runtime re-resolution can load-balance onto dead
    #      IPs (~3s timeout each) before reaching the live one.
    # Pinning the subnet + giving the backend a static IP sidesteps both: the
    # target is always valid, no matter how often the backend is recreated.

    # SPA routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend (see `ipv4_address` in container-compose.yaml).
    location /standards {
        proxy_pass http://10.89.0.10:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /projects {
        proxy_pass http://10.89.0.10:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /health {
        proxy_pass http://10.89.0.10:8000;
        proxy_set_header Host $host;
    }
    location /memorial {
        proxy_pass http://10.89.0.10:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /assets/alfchamps_logo.png {
        proxy_pass http://10.89.0.10:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Hide runtime versions.
    server_tokens off;
}
