server {
    listen 8080;
    server_name _;

    # Static frontend build.
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service (compose service name: backend).
    location /standards {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /projects {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /memorial {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /assets/alfchamps_logo.png {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Hide runtime versions.
    server_tokens off;
}
